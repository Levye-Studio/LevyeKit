<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #08090b; }
    body { overflow: hidden; }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%;
      outline: none; touch-action: none; }
    #status { position: fixed; bottom: 24px; left: 12px; right: 12px; text-align: center;
      color: #eee; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status" role="status">Loading game…</div>
  <script>
    var statusElement = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (message) {
        statusElement.textContent = message || '';
        statusElement.hidden = !message;
      },
      monitorRunDependencies: function (remaining) {
        Module.setStatus(remaining ? 'Loading game…' : '');
      },
      print: function (message) { console.log(message); },
      printErr: function (message) { console.error(message); },
      onAbort: function () { Module.setStatus('Game failed to start. See the browser console.'); }
    };
    Module.canvas.addEventListener('pointerdown', function () { Module.canvas.focus({ preventScroll: true }); });
    window.addEventListener('error', function () {
      Module.setStatus('Game error. See the browser console.');
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
